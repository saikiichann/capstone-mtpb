# Every ~15 minutes, asks the violator PWA's server to email people whose
# GCash payment MTPB staff just verified or rejected (checklist P2, see
# violator-pwa/server/status-notifier.js).
#
# Setup (once):
# - Repository secret VIOLATOR_PWA_CRON_SECRET (Settings → Secrets and
#   variables → Actions), the same value as CRON_SECRET in Vercel.
# Until the secret exists this does nothing and still passes.
#
# GitHub runs schedules on main only, sometimes a few minutes late, and pauses
# them after 60 days without any commits to the repository.
name: violator-pwa payment updates

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch: # "Run workflow" button, for testing

permissions: {}

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Ask the server to send payment status emails
        env:
          CRON_SECRET: ${{ secrets.VIOLATOR_PWA_CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "VIOLATOR_PWA_CRON_SECRET is not set yet; nothing to do."
            exit 0
          fi
          curl --fail-with-body --silent --show-error --max-time 60 -X POST \
            -H "Authorization: Bearer $CRON_SECRET" \
            https://mtpb-violators-pwa.vercel.app/api/notify-payment-updates
          echo
